name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-version 1.89 (File::lock): the stable toolchain is newer
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # what gpui (the window) links against
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev libssl-dev libzstd-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
