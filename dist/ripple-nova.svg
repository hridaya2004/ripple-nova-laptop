<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Ripple Control Center</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#0d2226"/>
      <stop offset="1" stop-color="#03090b"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46f0d6"/>
      <stop offset="1" stop-color="#0f8f80"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0" stop-color="#46f0d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8ffff0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#46f0d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- light streaks across the glow -->
  <rect x="14" y="123" width="228" height="2.2" fill="url(#streak)" opacity="0.8"/>
  <rect x="58" y="96" width="140" height="1.2" fill="url(#streak)" opacity="0.45" transform="rotate(-12 128 128)"/>
  <rect x="48" y="154" width="160" height="1.2" fill="url(#streak)" opacity="0.4" transform="rotate(-12 128 128)"/>
