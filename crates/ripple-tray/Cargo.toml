[package]
name = "ripple-tray"
description = "System tray icon for Ripple Control Center (a user-session helper; the window is a root process)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rcc-tray"
path = "src/main.rs"

[dependencies]
# async-io (not the default tokio): zbus in the tree already runs on it through gpui
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
