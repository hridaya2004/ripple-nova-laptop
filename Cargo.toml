[workspace]
resolver = "2"
members = ["crates/ripple-core", "crates/ripple-hw", "crates/ripple-cli", "crates/ripple-gui", "crates/ripple-tray"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# File::lock (cross-process EC lock) needs 1.89
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }

[profile.dev]
debug = 1

# Cargo.lock keeps libc at 0.2.189 on purpose. gpui -> gpui_http_client -> zed-async-tar needs xattr 0.2.3,
# which uses libc::ENOATTR, and libc 0.2.190 removed that on Linux. Do not `cargo update -p libc` until gpui
# moves to xattr >= 1 (the build then fails with "cannot find value `ENOATTR` in crate `libc`").
