[workspace]
resolver = "2"
members = ["crates/ripple-core", "crates/ripple-hw", "crates/ripple-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/local/ripple-nova"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }

[profile.dev]
debug = 1

# gpui -> zed-async-tar -> xattr 0.2.3 doesn't compile against current libc (no ENOATTR on Linux).
[patch.crates-io]
xattr = { path = "vendor/xattr" }
